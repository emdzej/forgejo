# Builds the Forgejo container images of this fork and publishes them to
# ghcr.io/<owner>/forgejo (root) and the same image with a -rootless suffix.
#
# Upstream CI lives in .forgejo/workflows and is not run by GitHub.
name: container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: root
            dockerfile: Dockerfile
            suffix: ""
          - name: rootless
            dockerfile: Dockerfile.rootless
            suffix: -rootless
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The fork does not carry upstream's recent tags, and the version Forgejo
      # reports (and checks against the database) is derived from `git describe`.
      - name: fetch upstream tags
        run: |
          git fetch --quiet --no-tags https://codeberg.org/forgejo/forgejo.git '+refs/tags/v*:refs/tags/v*' \
            || echo "::warning::could not fetch upstream tags, the version may be inaccurate"

      - name: determine version
        id: version
        run: |
          version=$(git describe --exclude '*-test' --tags --always | sed -e 's/^v//' -e 's/-g/-/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forgejo" >> "$GITHUB_OUTPUT"
          echo "Forgejo version: $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}
